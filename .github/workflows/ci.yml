# Fast verification gate (production-readiness plan, Phase 0.5).
#
# Deliberately does NOT install the ML stack (torch alone is ~2 GB): the
# pipeline / Qdrant-integration / MCP-protocol tests skip themselves when
# llama-index, testcontainers, or mcp are absent, while the metric/eval tests
# and all static checks run everywhere. The full suite (those heavy tests
# included) runs manually via tests-full.yml (Phase 3.6).
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling (no ML stack)
        # requests lets the MCP-shim tests run here; the flask/llama-index
        # tests still skip themselves.
        run: pip install pytest==9.0.3 ruff==0.15.16 requests==2.34.2

      - name: Lint (ruff)
        run: ruff check scripts/ eval/ tests/

      - name: Compile check
        run: python -m py_compile scripts/*.py eval/*.py

      - name: Tests (ML-stack tests skip automatically)
        run: python -m pytest tests/ -q
