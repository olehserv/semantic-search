# Fast verification gate (production-readiness plan, Phase 0.5).
#
# Deliberately does NOT install the ML stack (torch alone is ~2 GB): the
# pipeline tests in tests/test_query_index.py skip themselves when llama-index
# is absent, while the metric/eval tests and all static checks run everywhere.
# A full-stack integration job is planned for Phase 3.6.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling (no ML stack)
        run: pip install pytest==9.0.3 ruff==0.15.16

      - name: Lint (ruff)
        run: ruff check scripts/ eval/ tests/

      - name: Compile check
        run: python -m py_compile scripts/*.py eval/*.py

      - name: Tests (ML-stack tests skip automatically)
        run: python -m pytest tests/ -q
